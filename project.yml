# Xcode project for the iOS app and its Control Center button. Only the device
# build needs this — ./build-ios.sh still covers the simulator without Xcode.
#
# Regenerate with:  ./scripts/gen-xcode.sh
#
# Free personal-team signing: set DEVELOPMENT_TEAM below to your team ID, or
# leave it empty and pick the team in Xcode once under Signing & Capabilities.

name: Noty
options:
  bundleIdPrefix: com.kiranshivaraju
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Noty:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiranshivaraju.noty
        INFOPLIST_FILE: Info-iOS.plist
        # The plist is shared with build-ios.sh, which has no generated-asset
        # step, so nothing here may depend on an asset catalogue.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: NotyControl
        embed: true

  NotyControl:
    type: app-extension
    platform: iOS
    # ControlWidget is iOS 18. The app itself stays on 17 so it still runs on
    # older phones — they simply get no Control Center button.
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiranshivaraju.noty.control
        INFOPLIST_FILE: Info-Control.plist
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
